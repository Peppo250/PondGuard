name: 'PondGuard low battery warning'
version: 1
author: 'PondGuard validation pipeline'
steps:
  - set-control:
      part-id: doPot
      control: position
      value: 0.60
  - set-control:
      part-id: phSignalPot
      control: position
      value: 0.482
  - set-control:
      part-id: phBiasPot
      control: position
      value: 0.500
  - set-control:
      part-id: batteryPot
      control: position
      value: 0.500
  - set-control:
      part-id: nh3Pot
      control: position
      value: 0.050
  - delay: 6500ms
  - expect-pin:
      part-id: esp
      name: '0'
      value: 0
  - wait-serial: 'reason=BATTERY_LOW'
