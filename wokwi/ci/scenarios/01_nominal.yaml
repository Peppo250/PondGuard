name: 'PondGuard nominal operating point'
version: 1
author: 'PondGuard validation pipeline'
steps:
  - wait-serial: 'BOOT|ADS1115=PASS'
  - wait-serial: 'BOOT|GSM_UART=READY'
  - set-control:
      part-id: doPot
      control: position
      value: 0.60
  - set-control:
      part-id: phSignalPot
      control: position
      value: 0.482
  - set-control:
      part-id: phBiasPot
      control: position
      value: 0.500
  - set-control:
      part-id: batteryPot
      control: position
      value: 0.570
  - set-control:
      part-id: nh3Pot
      control: position
      value: 0.050
  - delay: 6500ms
  - expect-pin:
      part-id: esp
      name: '0'
      value: 0
